name: twenty

services:
  server:
    image: mobius/mobiut:${TAG:-0.0.0-mobius}
    build:
      context: ../..
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      args:
        # MODIFIED: Uses DOMAIN_NAME now
        REACT_APP_SERVER_BASE_URL: ${SERVER_URL:-https://${DOMAIN_NAME}}
        APP_VERSION: ${TAG:-0.0.0-mobius}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage

    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/default
      # MODIFIED: Uses DOMAIN_NAME
      SERVER_URL: ${SERVER_URL:-https://${DOMAIN_NAME}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION}

      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}

      APP_SECRET: ${APP_SECRET:-replace_me_with_a_random_string}
      APP_VERSION: ${TAG:-0.0.0-mobius}

      # MODIFIED: Replaced hardcoded email with ${SMTP_EMAIL_FROM}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-${SMTP_EMAIL_FROM}}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-"John from Fucking Domain"}
      EMAIL_SYSTEM_ADDRESS: ${EMAIL_SYSTEM_ADDRESS:-${SMTP_EMAIL_FROM}}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.gmail.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-${SMTP_EMAIL_FROM}}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-password}

    depends_on:
      - db
      - redis
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always
    networks:
      - dokploy-network

  worker:
    image: mobius/mobiut:${TAG:-0.0.0-mobius}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/default
      # MODIFIED: Uses DOMAIN_NAME
      SERVER_URL: ${SERVER_URL:-https://${DOMAIN_NAME}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: "true" 
      DISABLE_CRON_JOBS_REGISTRATION: "true" 

      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}

      APP_SECRET: ${APP_SECRET:-replace_me_with_a_random_string}
      APP_VERSION: ${TAG:-0.0.0-mobius}

      # MODIFIED: Replaced hardcoded email with ${SMTP_EMAIL_FROM}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-${SMTP_EMAIL_FROM}}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-"John from Fucking Domain"}
      EMAIL_SYSTEM_ADDRESS: ${EMAIL_SYSTEM_ADDRESS:-${SMTP_EMAIL_FROM}}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.gmail.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-${SMTP_EMAIL_FROM}}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-xjvx omam kyxf qjzd}

    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always
    networks:
      - dokploy-network

  db:
    image: postgres:16
    expose:
      - "5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-postgres}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - dokploy-network

  redis:
    image: redis
    restart: always
    command: ["--maxmemory-policy", "noeviction"]
    networks:
      - dokploy-network

volumes:
  db-data:
  server-local-data:

networks:
  dokploy-network:
    external: true
  ${TRAEFIK_NAME:-mobiuscrm-latestdb-u4lx3q}:
    name: ${TRAEFIK_NAME:-mobiuscrm-latestdb-u4lx3q}
    external: true
networks:
  twenty-net:
    driver: bridge

services:
  server:
    build:
      context: .
      dockerfile: packages/twenty-docker/twenty/Dockerfile
    image: mobius/twenty:dev
    environment:
      PG_DATABASE_URL: postgres://postgres:kfc@db:5432/default  # CONSISTENT (use .env for custom password)
    networks:
      - twenty-net

  worker:
    image: mobius/twenty:dev
    environment:
      PG_DATABASE_URL: postgres://postgres:kfc@db:5432/default  # CONSISTENT
    networks:
      - twenty-net
    
  db:
    networks:
      - twenty-net
      
  redis:
    networks:
      - twenty-net